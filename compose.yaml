services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: eye_interview
      POSTGRES_USER: eye_interview
      POSTGRES_PASSWORD: eye_interview
    ports:
      - "127.0.0.1:6432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
